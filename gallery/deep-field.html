<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep field — nine places, ordered by how far the light travelled</title>
<meta name="description" content="A typographic map of deep space: nine real places, set edge to edge, ordered by how far their light travelled to reach us.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
  :root {
    /* Colour — see .design/declaration.md */
    --ground:      #000000;
    --name:        #F4F6FA;
    --origin:      #F5C168;
    --star-warm:   #E8D4B4;
    --grey-70:     #A8B2C2;
    --grey-52:     #7E889A;

    /* Spacing — base unit 8 */
    --s1: 8px;
    --s2: 16px;
    --s3: 24px;

    /* Radius — one step */
    --r0: 0;

    /* Not elevation: a halo that holds type legible over the starfield */
    --halo: 0 0 24px rgba(0,0,0,.92), 0 0 6px rgba(0,0,0,.72);

    /* Motion */
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --reveal: 260ms;
    --step: 70ms;

    --frame: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--ground);
    color: var(--name);
    font-family: var(--frame);
    overflow: hidden;
  }

  #field {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
  }

  .poster {
    position: relative;
    z-index: 1;
    height: 100%;
    padding: var(--s2) var(--s1);
    display: flex;
    flex-direction: column;
  }

  /* ---- masthead: the page's name at one frame edge, what the order means at the other ---- */
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: var(--s3);
    flex: none;
    margin-bottom: var(--s3);
  }
  .masthead h1,
  .masthead p {
    font-size: 15px;
    line-height: 1.2;
    font-weight: 600;
    font-stretch: 87%;
    letter-spacing: 0.16em;
    color: var(--grey-52);
    text-shadow: var(--halo);
  }
  .masthead p {
    font-weight: 500;
    text-align: right;
    max-width: 72ch;
  }

  /* ---- the map ---- */
  .map {
    flex: 1 1 auto;
    min-height: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: var(--s3);
    overflow-y: auto;
    scrollbar-width: none;
  }
  .map::-webkit-scrollbar { display: none; }

  .row { display: block; }

  .name {
    display: block;
    white-space: nowrap;
    font-size: 0;
    line-height: 0;
    color: var(--name);
    text-shadow: var(--halo);
  }
  .name > span {
    display: inline-block;
    vertical-align: top;
    line-height: 0.80;
    font-weight: 700;
    font-stretch: 62%;
    font-size: 64px;               /* replaced by the solver */
    letter-spacing: 0;             /* replaced by the solver */
    white-space: pre;
  }

  /* the caption belongs to the name above it: 8 inside the group, 24 between groups */
  .caption {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: var(--s2);
    margin-top: var(--s1);
  }
  .distance {
    font-size: 13px;
    line-height: 1.2;
    font-weight: 500;
    font-stretch: 100%;
    letter-spacing: 0.10em;
    font-variant-numeric: tabular-nums;
    color: var(--grey-70);
    text-shadow: var(--halo);
    white-space: nowrap;
  }
  .descriptor {
    font-size: 12px;
    line-height: 1.3;
    font-weight: 400;
    font-stretch: 100%;
    letter-spacing: 0.02em;
    color: var(--grey-52);
    text-shadow: var(--halo);
    text-align: right;
  }

  /* the accent marks the map's origin, and nothing else on the page */
  .row.origin .name,
  .row.origin .distance,
  .row.origin .descriptor { color: var(--origin); }

  .colophon {
    flex: none;
    margin-top: var(--s3);
    max-width: 72ch;
    font-size: 11px;
    line-height: 1.4;
    font-weight: 400;
    font-stretch: 100%;
    letter-spacing: 0.06em;
    color: var(--grey-52);
    text-shadow: var(--halo);
  }

  /* ---- the one reveal: farthest row first, opening at 95% behind a fade ---- */
  .row {
    opacity: 0;
    transform: scale(0.95);
  }
  .ready .row {
    opacity: 1;
    transform: none;
    transition:
      opacity var(--reveal) var(--ease-out) var(--delay),
      transform var(--reveal) var(--ease-out) var(--delay);
  }

  @media (prefers-reduced-motion: reduce) {
    .row { transform: none; }
    .ready .row {
      transition: opacity var(--reveal) var(--ease-out) var(--delay);
    }
  }

  /* narrow frames: the caption stacks rather than sharing a line. Nothing hides. */
  @media (max-width: 560px) {
    .caption {
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
    }
    .descriptor { text-align: left; }
    .map { gap: var(--s2); }
    .masthead { display: block; }
    .masthead p { text-align: left; margin-top: var(--s1); }
  }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>

<main class="poster">
  <header class="masthead">
    <h1>Deep field</h1>
    <p>ordered by how far the light travelled</p>
  </header>

  <ol class="map" id="map"></ol>

  <p class="colophon">Light-travel distances from published estimates by NASA, ESA and Gaia.</p>
</main>

<script>
(function () {
  'use strict';

  /* Nine real places, nearest first. Distances are light-travel distances in light-years. */
  var PLACES = [
    { name: 'EARTH',            ly: 0,           what: 'where you are standing',                    origin: true },
    { name: 'PROXIMA CENTAURI', ly: 4.2,         what: 'the nearest star to the Sun' },
    { name: 'BETELGEUSE',       ly: 650,         what: 'a red supergiant near its end' },
    { name: 'ORION NEBULA',     ly: 1344,        what: 'where new stars are being made' },
    { name: 'SAGITTARIUS A*',   ly: 26700,       what: 'the black hole at our galaxy’s centre' },
    { name: 'TARANTULA NEBULA', ly: 160000,      what: 'the brightest star nursery known' },
    { name: 'ANDROMEDA',        ly: 2537000,     what: 'the next large galaxy over' },
    { name: 'WHIRLPOOL GALAXY', ly: 23000000,    what: 'a spiral being pulled apart by its neighbour' },
    { name: 'GN-Z11',           ly: 13400000000, what: 'the oldest galaxy yet seen' }
  ];

  /* ---- numbers are copy: every figure comes from the locale formatter ---- */
  var plain = new Intl.NumberFormat('en-GB', { maximumFractionDigits: 1 });
  var large = new Intl.NumberFormat('en-GB', {
    notation: 'compact', compactDisplay: 'long', maximumSignificantDigits: 3
  });
  function distance(ly) {
    var n = ly >= 1e6 ? large.format(ly) : plain.format(ly);
    return n + ' light-years';
  }

  /* ---- build the map ---- */
  var map = document.getElementById('map');
  var STAGGER_STOPS_AT = 8;   /* a stagger runs to the eighth item; the rest arrive together */
  var rows = PLACES.map(function (place, i) {
    var li = document.createElement('li');
    li.className = 'row' + (place.origin ? ' origin' : '');

    /* farthest first: the light from the far end of the map arrives before the near end */
    var step = Math.min(PLACES.length - 1 - i, STAGGER_STOPS_AT - 1);
    li.style.setProperty('--delay', (step * 70) + 'ms');

    var name = document.createElement('div');
    name.className = 'name';
    var glyphs = document.createElement('span');
    glyphs.textContent = place.name;
    name.appendChild(glyphs);

    var caption = document.createElement('div');
    caption.className = 'caption';
    var dist = document.createElement('span');
    dist.className = 'distance';
    dist.textContent = distance(place.ly);
    var what = document.createElement('span');
    what.className = 'descriptor';
    what.textContent = place.what;
    caption.appendChild(dist);
    caption.appendChild(what);

    li.appendChild(name);
    li.appendChild(caption);
    map.appendChild(li);
    return { li: li, glyphs: glyphs, caption: caption, place: place };
  });

  /* ---- the solver: size falls with distance, tracking spans the frame ---- */
  var LO = Math.log10(4.2), HI = Math.log10(13.4e9);
  var FLOOR = 11;
  var REF = 200;

  /* The size ladder is the distance axis. It runs steep on purpose: a gentle ramp reads as nine
     lines set at nine arbitrary sizes, and the reader has to take the figures on trust. */
  function target(ly, frameWidth) {
    var near = 0.200 * frameWidth;
    var far  = 0.024 * frameWidth;
    if (ly <= 0) return near;
    var t = (Math.log10(ly) - LO) / (HI - LO);
    t = Math.pow(Math.max(0, Math.min(1, t)), 0.80);
    return near - (near - far) * t;
  }

  /* A ruler that lives outside the map, so the reveal's scale never contaminates a measurement */
  var ruler = document.createElement('span');
  ruler.setAttribute('aria-hidden', 'true');
  ruler.style.cssText = 'position:absolute;left:-99999px;top:0;visibility:hidden;' +
    'white-space:pre;font-weight:700;font-stretch:62%;letter-spacing:0;line-height:0.80;' +
    'font-size:' + REF + 'px;font-family:' + getComputedStyle(document.body).fontFamily + ';';
  document.body.appendChild(ruler);

  /* Width of one name per pixel of font size, at letter-spacing zero */
  function unitWidth(name) {
    ruler.textContent = name;
    return ruler.offsetWidth / REF;
  }

  function solve() {
    /* The frame is the viewport minus its inset. Read from the document, never from the map:
       a nowrap name is wider than its container by design, and a container asked how wide it is
       answers with the overflow. */
    var frameWidth = document.documentElement.clientWidth - 16;
    var available = map.clientHeight - 8;
    if (frameWidth <= 0 || available <= 0) return;

    var MIN_TRACK_EM = 0.03;   /* letters never touch, however dense the near end gets */

    /* 1. the ladder: size falls with distance, then is capped where a long name would not fit */
    var units = rows.map(function (row) { return unitWidth(row.place.name); });
    var sizes = rows.map(function (row, i) {
      var cap = frameWidth / (units[i] + MIN_TRACK_EM * row.place.name.length);
      return Math.min(target(row.place.ly, frameWidth), cap);
    });

    /* 2. the fit: captions and row gaps are fixed, so only the type carries the correction.
       Both come off the stylesheet, so the narrower gap the media query sets is honoured here. */
    var mapStyle = getComputedStyle(map);
    var rowGap = parseFloat(mapStyle.rowGap) || 24;
    var capGap = parseFloat(getComputedStyle(rows[0].caption).marginTop) || 8;
    var fixed = (rows.length - 1) * rowGap;
    rows.forEach(function (row) { fixed += row.caption.offsetHeight + capGap; });
    var typeHeight = sizes.reduce(function (a, s) { return a + s * 0.80; }, 0);
    var k = (available - fixed) / typeHeight;
    if (!isFinite(k)) k = 1;
    /* Below the floor the ladder stops shrinking and the map scrolls instead. A frame too short
       for nine rows gets nine readable rows and a scroll, not nine rows of 11px type. */
    k = Math.max(0.75, Math.min(2.5, k));

    /* 3. the tracking: solved per row so the name spans the frame, edge to edge */
    rows.forEach(function (row, i) {
      var n = row.place.name.length;
      var cap = frameWidth / (units[i] + MIN_TRACK_EM * n);
      var size = Math.max(FLOOR, Math.min(sizes[i] * k, cap));
      var track = Math.max(size * MIN_TRACK_EM, (frameWidth - units[i] * size) / n);
      row.glyphs.style.fontSize = size + 'px';
      row.glyphs.style.letterSpacing = track + 'px';
      row.glyphs.style.marginRight = (-track) + 'px';   /* cancel the space after the last letter */
    });
  }

  /* ---- the starfield: three depth layers, drawn from the declared palette ---- */
  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');
  var still = window.matchMedia('(prefers-reduced-motion: reduce)');
  var LAYERS = [
    { count: 1400, rMin: 0.40, rMax: 0.85, aMin: 0.18, aMax: 0.38, vx: 0.0016, vy: 0.0005, dim: true,  halo: 0 },
    { count:  520, rMin: 0.70, rMax: 1.25, aMin: 0.28, aMax: 0.52, vx: 0.0038, vy: 0.0012, dim: true,  halo: 0 },
    { count:  150, rMin: 1.05, rMax: 1.90, aMin: 0.40, aMax: 0.62, vx: 0.0068, vy: 0.0022, dim: false, halo: 2.6 }
  ];
  var stars = [];
  var W = 0, H = 0, dpr = 1;

  /* the field is painted out of the declaration, not out of literals in this file */
  var root = getComputedStyle(document.documentElement);
  var PALETTE = {
    warm:   root.getPropertyValue('--star-warm').trim(),
    dim:    root.getPropertyValue('--grey-52').trim(),
    bright: root.getPropertyValue('--grey-70').trim()
  };

  function seed() {
    stars = [];
    LAYERS.forEach(function (layer) {
      for (var i = 0; i < layer.count; i++) {
        stars.push({
          x: Math.random(), y: Math.random(),
          r: layer.rMin + Math.random() * (layer.rMax - layer.rMin),
          a: layer.aMin + Math.random() * (layer.aMax - layer.aMin),
          vx: layer.vx, vy: layer.vy,
          dim: layer.dim, halo: layer.halo,
          warm: Math.random() < 0.16,
          phase: Math.random() * Math.PI * 2,
          rate: 0.0006 + Math.random() * 0.0014
        });
      }
    });
  }

  function sizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function paint(t) {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var x = (s.x + s.vx * t / 1000) % 1;
      var y = (s.y + s.vy * t / 1000) % 1;
      if (x < 0) x += 1;
      if (y < 0) y += 1;
      var twinkle = 0.78 + 0.22 * Math.sin(t * s.rate + s.phase);
      ctx.fillStyle = s.warm ? PALETTE.warm : (s.dim ? PALETTE.dim : PALETTE.bright);
      var px = x * W, py = y * H;
      if (s.halo) {                       /* the nearest layer carries a little air around it */
        ctx.globalAlpha = s.a * twinkle * 0.13;
        ctx.beginPath();
        ctx.arc(px, py, s.r * s.halo, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = s.a * twinkle;
      ctx.beginPath();
      ctx.arc(px, py, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  var start = null;
  function frame(now) {
    if (start === null) start = now;
    paint(now - start);
    if (!still.matches) requestAnimationFrame(frame);
  }

  /* ---- start ---- */
  function layout() {
    sizeCanvas();
    if (!stars.length) seed();
    try { solve(); } catch (e) { /* a solved map is an improvement, not a precondition */ }
    if (still.matches) paint(0);
  }

  /* the reveal can start whatever the solver does: nothing here may leave the map invisible */
  document.body.classList.add('ready');
  layout();
  requestAnimationFrame(frame);

  /* the map is solved against whichever face resolved first, then again when Archivo lands */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { try { solve(); } catch (e) {} });
  }

  var pending = null;
  window.addEventListener('resize', function () {
    clearTimeout(pending);
    pending = setTimeout(layout, 120);
  });
  still.addEventListener('change', function () {
    start = null;
    if (still.matches) { paint(0); } else { requestAnimationFrame(frame); }
  });

  window.__solve = solve;   /* the inspection harness re-solves after forcing a state */
})();
</script>
</body>
</html>
