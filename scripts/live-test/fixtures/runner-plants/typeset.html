<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typeset</title>
<style>
  body { margin: 0; font: 16px/1.8 sans-serif; color: #222; background: #fff; letter-spacing: 0.04em; }
  main { padding: 16px; }
  .tag { font-size: 15px; margin: 0; }
</style>
</head>
<body>
<main>
  <p class="tag">Status</p>
  <p>The running text of this page is set at four hundredths of an em of letter-spacing throughout.</p>
  <p>Every paragraph here carries the same spacing, so the small label above is typeset like the rest.</p>
</main>
</body>
</html>
