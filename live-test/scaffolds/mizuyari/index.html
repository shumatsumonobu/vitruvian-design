<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>みずやり帳 — 鉢ごとの水やりの日</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="./">みずやり帳</a>
    <button class="help-open" type="button">使い方</button>
  </header>

  <main>
    <section class="hero">
      <h1 class="hero-title">きょう水がほしい鉢</h1>
      <p class="hero-lead" id="today-line"></p>
    </section>

    <section class="pots" aria-labelledby="pots-title">
      <h2 id="pots-title">鉢の一覧</h2>
      <ul class="pot-list"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>みずやり帳 — 水やりの日を、鉢ごとに。</p>
  </footer>

  <div class="help" hidden>
    <div class="help-sheet" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <h2 id="help-title">使い方</h2>
      <p>水をやったら、その鉢の「水をやった」を押します。最後の日と次の日が書き換わります。鉢を足す画面はこれから作ります。</p>
      <button class="help-close" type="button">閉じる</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
